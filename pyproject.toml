
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennispack"
version = "0.1.0"
description = "Tennis career match data and visualization package"
readme = "readme.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "requests",
    "matplotlib"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.setuptools.packages.find]
include = ["tennispack*"]
